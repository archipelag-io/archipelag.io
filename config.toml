# Zola configuration for archipelag.io

# Site metadata
title = "Archipelag.io"
description = "Compute, closer to you. Archipelag.io routes AI Jobs to nearby independently operated Islands."
base_url = "https://archipelag.io"

# Build settings
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# Content settings
default_language = "en"

# Taxonomy for blog/docs if needed
taxonomies = [
    { name = "categories", feed = true },
    { name = "tags", feed = true },
]

# Build output
output_dir = "public"

[link_checker]
# The Scalar reference rejects Zola's link-checker user agent with HTTP 406,
# while remaining available to browsers.
skip_prefixes = ["https://app.archipelag.io/api/v1/docs"]

# Theme settings
[extra]
# Site metadata
author = "Archipelag.io"
email = "hello@archipelag.io"
tagline = "Compute, closer to you."
phase = "Phase 2"
phase_summary = "Free and credits-only while reliability, placement, and the approved Cargo catalog are validated."
financial_status = "Virtual credits only. Real-money billing and Island payouts are not enabled."
company_founded = "2025"
waitlist_url = "https://buttondown.email/api/emails/embed-subscribe/raskell"
design_partner_email = "partners@archipelag.io"

# Navigation
nav_items = [
    { name = "Use AI", url = "/use" },
    { name = "Operate an Island", url = "/earn" },
]

# Social links
github = "https://github.com/archipelag-io"
linkedin = "https://www.linkedin.com/company/archipelag-io"
twitter = "@archipelagio"

# App URLs
app_base_url = "https://app.archipelag.io"
# use_ai_url and earn_url removed — these app routes don't exist;
# use /use and /earn website pages instead

# Color scheme (for potential theme switching)
default_theme = "light"

# Analytics (placeholder for future)
# analytics_id = ""

[markdown]
smart_punctuation = true
bottom_footnotes = true
